<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.3.1/css/all.css"
      integrity="sha512-x9WwyMYBnlXMNQ6kQ/Lyzu1NqIhLQKL5Oq6xByfXuRj7s9CskyCbLv/1IjqzJmXwFXWr0ov6jBV7Qbc0hh9nHg=="
      crossorigin="anonymous"
      referrerpolicy="no-referrer"
    />
    <title>smart home</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <header>
      <div class="home-title">
        <div class="home-icon">
          <i class="fa-solid fa-house"></i>
        </div>
        <div class="title">
          <h1>smart home</h1>
          <p>Control your home, easily</p>
        </div>
      </div>
      <div class="date-time">
        <div class="icon"><i class="fa-regular fa-clock"></i></div>
        <div class="time">
          <div id="currentTime" class="time">12:36 PM</div>
          <div id="currentDate" class="date">Sat, 24 May</div>
        </div>
      </div>
      <div class="user-icon"><i class="fa-solid fa-user"></i></div>
    </header>
    <div class="rooms">
      <button class="room-btn" data-room="main">main</button>
      <button class="room-btn" data-room="living">living room</button>
      <button class="room-btn" data-room="bedroom">bedroom</button>
      <button class="room-btn" data-room="bathroom">bathroom</button>
    </div>

    <div class="rooms-container">
      <div class="room-devices" id="main">
        <div class="feature">
          <div class="feature-wrapper">
            <div class="icon door"><i class="fa-brands fa-windows"></i></div>
            <div class="feature-description">
              <h2>window</h2>
              <p>main house</p>
            </div>
          </div>
          <div class="toggle-wrapper">
            <div class="toggle" id="gateMain">
              <span></span>
            </div>
          </div>
        </div>
        <div class="feature">
          <div class="feature-wrapper">
            <div class="icon door"><i class="fa-solid fa-door-open"></i></div>
            <div class="feature-description">
              <h2>house door</h2>
              <p>main house</p>
            </div>
          </div>
          <div class="toggle-wrapper">
            <div class="toggle" id="door">
              <span></span>
            </div>
          </div>
        </div>
        <div class="feature">
          <div class="feature-wrapper">
            <div class="icon light"><i class="fa-solid fa-lightbulb"></i></div>
            <div class="feature-description">
              <h2>lights</h2>
              <p>main house</p>
            </div>
          </div>
          <div class="toggle-wrapper">
            <div class="toggle" id="lightMain">
              <span></span>
            </div>
          </div>
        </div>
      </div>
      <div class="room-devices" id="living">
        <div class="feature">
          <div class="feature-wrapper">
            <div class="icon light"><i class="fa-solid fa-lightbulb"></i></div>
            <div class="feature-description">
              <h2>lights</h2>
              <p>living room</p>
            </div>
          </div>
          <div class="toggle-wrapper">
            <div class="toggle" id="lights">
              <span></span>
            </div>
          </div>
        </div>
      </div>
    </div>
    <div id="security-alert" hidden>
      <p id="security-message">Warning! Window intrusion detected.</p>
      <button id="security-ok">OK</button>
    </div>
    <script src="script.js"></script>
  </body>
</html>
